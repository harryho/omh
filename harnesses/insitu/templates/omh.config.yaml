# omh.config.yaml — project harness configuration (schema v3)
omh: v3
harness: insitu               # upgrade an existing app/system in place to a newer LTS/runtime
project: <name>
source_contract:
  kind: legacy-app            # legacy-app | existing-tests | api-spec | greenfield
  inventory: notes/parity-census.md
stack:
  from: <current stack>       # free text, e.g. "WinForms .NET Framework 4.8 desktop"
  to: <target LTS/runtime>    # free text, e.g. ".NET 10 (net10.0-windows)"
gates:                        # direction is human by law — not settable here
  spec: human
  plan: auto
  footprint: auto
  smoke: auto
  close: human
escalations:                  # hard stops in every mode; edit only with a dated register entry
  - blocking-decision
  - fail-after-one-fix-round
  - drift-1.5x
  - unexplained-tree
  - footprint-violation
  - major-or-blocker-deviation
  - parity-gap-outside-census
preset: max-diversity         # model preset: max-diversity | balanced | budget (harness MODELS.md)
roles:                        # one line per role — validate-config.sh parses exactly this shape
  A: { provider: zai-anthropic, model: glm-5.3, type: planner }
  B: { provider: zai-anthropic, model: glm-5.3-flash, type: builder }
  R: { provider: kimi, model: kimi-k2.7-code, type: reviewer }
  V: { provider: minimax-anthropic, model: MiniMax-M3.1-Flash, type: verifier }
independence: R-B, V-B, V-R   # the FXPA three-vendor law — hard pairs, validator-enforced
verification:                 # machine gates P5a/P5b run; one probe per census row lands here
  - "<command>"
ledger: true                  # stamp role + provider + model in every produced doc header
